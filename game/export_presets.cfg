<meta name='mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-status-bar-style' content='black-translucent'>
<meta name='apple-mobile-web-app-title' content='Pixel Polo'>
<script>document.title = 'Pixel Polo: Water Polo Dynasty';</script>
<meta name='theme-color' content='#0f1830'>
<link rel='manifest' href='manifest.webmanifest'>
<style>
html, body { position: fixed; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0f1830; }
html, body, #canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
#canvas { position: fixed; left: 0; top: 0; }
#rp-safe { position: fixed; top: env(safe-area-inset-top, 0px); right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); visibility: hidden; pointer-events: none; }
#rotate-hint { display: none; position: fixed; inset: 0; z-index: 1000; background: #0f1830; color: #ffd83d; font: bold 20px monospace; text-align: center; align-items: center; justify-content: center; flex-direction: column; padding: 24px; }
#rotate-hint span { font-size: 64px; margin-bottom: 16px; }
@media (orientation: portrait) and (pointer: coarse) { #rotate-hint { display: flex; } }
</style>
<script>
(function () {
	// The canvas is sized here and nowhere else: Godot's canvas resize policy is None, so it just
	// follows canvas.width/height, and its touch mapping (getBoundingClientRect) sees the same box.
	var vp = document.querySelector('meta[name=viewport]');
	if (vp) {
		vp.setAttribute('content', 'width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover');
	}
	function fit() {
		var canvas = document.getElementById('canvas');
		var safe = document.getElementById('rp-safe');
		if (!canvas || !safe) {
			return;
		}
		if (window.scrollX || window.scrollY) {
			window.scrollTo(0, 0);
		}
		// the safe area as CSS actually laid it out (not innerWidth/innerHeight, which iOS
		// home-screen apps report stale after launch and rotation), cut to what's on screen
		var r = safe.getBoundingClientRect();
		var l = r.left, t = r.top, rt = r.right, b = r.bottom;
		var vv = window.visualViewport;
		if (vv && Math.abs(vv.scale - 1) < 0.01) {
			l = Math.max(l, vv.offsetLeft);
			t = Math.max(t, vv.offsetTop);
			rt = Math.min(rt, vv.offsetLeft + vv.width);
			b = Math.min(b, vv.offsetTop + vv.height);
		}
		var x = Math.round(l), y = Math.round(t);
		var w = Math.max(1, Math.floor(rt - x)), h = Math.max(1, Math.floor(b - y));
		var dpr = window.devicePixelRatio || 1;
		var bw = Math.round(w * dpr), bh = Math.round(h * dpr);
		var s = canvas.style;
		if (s.left !== x + 'px') { s.left = x + 'px'; }
		if (s.top !== y + 'px') { s.top = y + 'px'; }
		if (s.width !== w + 'px') { s.width = w + 'px'; }
		if (s.height !== h + 'px') { s.height = h + 'px'; }
		if (canvas.width !== bw) { canvas.width = bw; }
		if (canvas.height !== bh) { canvas.height = bh; }
	}
	function fitSoon() {
		fit();
		[50, 250, 600, 1200].forEach(function (ms) { setTimeout(fit, ms); });
	}
	window.addEventListener('resize', fit);
	window.addEventListener('orientationchange', fitSoon);
	window.addEventListener('pageshow', fitSoon);
	window.addEventListener('focus', fit);
	if (window.visualViewport) {
		window.visualViewport.addEventListener('resize', fit);
		window.visualViewport.addEventListener('scroll', fit);
	}
	setInterval(fit, 500);
	document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
	document.addEventListener('DOMContentLoaded', function () {
		var safe = document.createElement('div');
		safe.id = 'rp-safe';
		document.body.appendChild(safe);
		var hint = document.createElement('div');
		hint.id = 'rotate-hint';
		hint.innerHTML = '<span>&#x21bb;</span>TURN YOUR PHONE SIDEWAYS TO PLAY PIXEL POLO';
		document.body.appendChild(hint);
		fitSoon();
	});
	document.addEventListener('fullscreenchange', function () {
		fitSoon();
		try { if (document.fullscreenElement && screen.orientation && screen.orientation.lock) { screen.orientation.lock('landscape').catch(function () {}); } } catch (e) {}
	});
}());
</script>"
